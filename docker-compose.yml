# Local MongoDB single-node replica set (required for multi-document
# transactions, e.g. assessorDayLocks on assign/reassign/cancel).
#
# Start (from repo root):
#   docker compose up -d
#
# Connect from your machine (Node/Mongoose on the host):
#   mongodb://127.0.0.1:27017/aa_portal?replicaSet=rs0&directConnection=true
#
# The healthcheck initiates rs0 against 127.0.0.1 so the advertised
# primary matches the published host port.
services:
  mongo:
    image: mongo:7
    container_name: aa-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { quit(rs.status().ok ? 0 : 1) } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }); quit(0) }\"",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo_data:
